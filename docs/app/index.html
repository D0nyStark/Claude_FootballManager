<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/Claude_FootballManager/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="실력 균형이 맞는 풋살 팀을 자동으로 짜 주는 앱">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="팀메이커">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="robots" content="noindex">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>풋살 팀메이커</title>
  <meta name="theme-color" content="#3B6A41">
  <!-- 웹은 밝은 모드로 고정 -->
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.json">
  <!-- 페이퍼로지 웹폰트. 앱 안 글자는 Flutter가 번들한 같은 폰트로 그려서 CDN 없이도 깨지지 않는다. -->
  <style>
    @font-face {
      font-family: 'Paperlogy';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Paperlogy';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

      font-weight: 600;
      font-style: normal;
    }

      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
      font-weight: 800;
      font-style: normal;
    }
    html, body { background: #ffffff; font-family: 'Paperlogy', sans-serif; font-weight: 400; }
    h1, h2 { font-weight: 800; }
    h3, button { font-weight: 600; }
    p, li, span { font-weight: 400; }
    small, caption, figcaption, .caption { font-weight: 400; }  /* 캡션도 400 (작은 크기·회색으로 구분) */

</head>

  <script src="flutter_bootstrap.js" async></script>
